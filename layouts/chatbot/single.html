{{ define "main" }}
<style>
  .page-body.my-10 { margin: 0 !important; padding: 0 !important; }

  .gk-chat {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    height: calc(100vh - var(--navbar-height, 64px));
    max-width: 820px; margin: 0 auto;
    background: #fff;
    color: #3a4a6b;
  }

  .gk-chat-header {
    text-align: center;
    padding: 32px 16px 0;
    flex-shrink: 0;
  }
  .gk-chat-header h1 {
    font-size: clamp(18px, 4vw, 32px);
    font-weight: 700; color: #5876a9;
    margin: 0 0 6px; letter-spacing: -0.02em;
  }
  .gk-chat-header .sep {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 10px;
  }
  .gk-chat-header .sep-line { width: 28px; height: 1.5px; border-radius: 2px; background: #abc5ec; }
  .gk-chat-header .sep-dot { width: 6px; height: 6px; border-radius: 50%; background: #efc5de; }

  .gk-chat-messages {
    flex: 1; overflow-y: auto;
    padding: 20px 16px 8px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .gk-chat.gk-empty .gk-chat-messages { display: none; }
  .gk-chat.gk-empty .gk-chat-header { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 16px; }
  .gk-chat.gk-empty .gk-input-area { flex: 0; }
  .gk-chat.gk-empty .gk-footer { flex: 1; padding-top: 8px; }

  .gk-msg { display: flex; gap: 10px; align-items: flex-start; }
  .gk-msg.user { justify-content: flex-end; }

  .gk-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, #5876a9, #abc5ec);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 2px;
  }

  .gk-bubble {
    max-width: 75%; padding: 10px 14px;
    font-size: 15px; line-height: 1.8;
    word-break: break-word; white-space: pre-wrap;
  }
  .gk-msg.user .gk-bubble {
    border-radius: 16px 16px 4px 16px;
    background: #5876a9; color: #fff;
  }
  .gk-msg.bot .gk-bubble {
    border-radius: 16px 16px 16px 4px;
    background: #f7f9fc; color: #3a4a6b;
    border: 1px solid #dde8f5;
  }
  .gk-bubble strong { color: #5876a9; font-weight: 700; }
  .gk-bubble code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    background: #eef2f9; border: 1px solid #dde8f5; border-radius: 4px;
    padding: 1px 5px; font-size: 0.9em; color: #5876a9;
  }
  .gk-bubble a { color: #5876a9; text-decoration: underline; }
  .gk-msg.user .gk-bubble strong { color: #fff; }
  .gk-msg.user .gk-bubble a { color: #fff; }

  .gk-welcome {
    color: #7a8fb5; font-size: 14px; text-align: center;
    margin: 0 0 8px; padding: 0 8px;
  }

  .gk-typing {
    background: #f7f9fc; border: 1px solid #dde8f5;
    border-radius: 16px 16px 16px 4px;
    padding: 12px 16px; display: flex; gap: 5px;
  }
  .gk-typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #5876a9; animation: gkPulse 1.2s infinite;
  }
  .gk-typing span:nth-child(2) { animation-delay: 120ms; }
  .gk-typing span:nth-child(3) { animation-delay: 240ms; }
  @keyframes gkPulse {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .gk-feedback-row {
    display: flex; gap: 4px; align-items: center;
    margin: 2px 0 0 40px;
  }
  .gk-fb-btn {
    background: transparent; border: none; cursor: pointer;
    padding: 4px; border-radius: 6px; line-height: 0;
    color: #8a9ab8; transition: background 0.15s, color 0.15s;
  }
  .gk-fb-btn.up:hover:not(:disabled) { background: #e6f7f0; color: #2bb673; }
  .gk-fb-btn.down:hover:not(:disabled) { background: #fdeceb; color: #e15554; }
  .gk-fb-btn.up.active { color: #2bb673; }
  .gk-fb-btn.down.active { color: #e15554; }
  .gk-fb-btn:disabled { cursor: default; }
  .gk-fb-btn.active:disabled { opacity: 1; }
  .gk-fb-thanks { font-size: 11px; color: #8a9ab8; margin-left: 4px; }

  .gk-fb-comment {
    margin: 6px 0 0 40px;
    display: flex; flex-direction: column; gap: 6px;
    background: #fff; border: 1px solid #dde8f5; border-radius: 10px;
    padding: 8px;
  }
  .gk-fb-comment textarea {
    border: none; outline: none; resize: vertical;
    min-height: 48px; max-height: 120px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px; color: #3a4a6b;
  }
  .gk-fb-comment .gk-fb-actions {
    display: flex; gap: 6px; justify-content: flex-end;
  }
  .gk-fb-comment button {
    font-size: 12px; padding: 5px 10px; border-radius: 6px;
    border: 1px solid #dde8f5; background: #fff; color: #5876a9;
    cursor: pointer; font-family: inherit;
  }
  .gk-fb-comment button.primary {
    background: linear-gradient(135deg, #5876a9, #abc5ec);
    border-color: transparent; color: #fff;
  }

  .gk-session-rating {
    position: relative;
    margin: 10px auto 4px;
    padding: 12px 34px 12px 16px;
    background: #fff; border: 1px solid #dde8f5; border-radius: 12px;
    box-shadow: 0 2px 10px rgba(88,118,169,0.08);
    display: flex; flex-direction: column; gap: 8px;
    max-width: 440px;
  }
  .gk-sr-question { font-size: 13px; color: #3a4a6b; font-weight: 600; }
  .gk-sr-optional { font-weight: 400; color: #8a9ab8; }
  .gk-sr-options { display: flex; gap: 6px; flex-wrap: wrap; }
  .gk-sr-options button {
    font-size: 13px; padding: 6px 12px; border-radius: 999px;
    border: 1px solid #dde8f5; background: #f7f9fc; color: #3a4a6b;
    cursor: pointer; font-family: inherit;
    transition: background 0.15s, border-color 0.15s;
  }
  .gk-sr-options button:hover { background: #fff; border-color: #abc5ec; }
  .gk-sr-dismiss {
    position: absolute; top: 6px; right: 8px;
    background: transparent; border: none; cursor: pointer;
    color: #b0bfd4; font-size: 13px; padding: 2px; line-height: 1;
  }
  .gk-sr-dismiss:hover { color: #5876a9; }
  .gk-sr-thanks { font-size: 12px; color: #8a9ab8; }
  .gk-session-rating textarea {
    border: 1px solid #dde8f5; border-radius: 8px; outline: none; resize: vertical;
    min-height: 44px; max-height: 120px; padding: 6px 8px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px; color: #3a4a6b;
  }
  .gk-sr-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .gk-sr-actions button {
    font-size: 12px; padding: 5px 10px; border-radius: 6px;
    border: 1px solid #dde8f5; background: #fff; color: #5876a9;
    cursor: pointer; font-family: inherit;
  }
  .gk-sr-actions button.primary {
    background: linear-gradient(135deg, #5876a9, #abc5ec);
    border-color: transparent; color: #fff;
  }

  .gk-figures {
    margin-top: 10px; padding-top: 8px;
    border-top: 1px dashed #dde8f5;
    display: flex; flex-direction: column; gap: 8px;
  }
  .gk-figures-label {
    font-size: 9px; font-weight: 700; letter-spacing: 1.2px;
    text-transform: uppercase; color: #8a9ab8;
  }
  .gk-figure a { display: block; line-height: 0; }
  .gk-figure img {
    display: block; width: 100%; height: auto;
    max-height: 260px; object-fit: contain;
    background: #f7f9fc; border: 1px solid #dde8f5; border-radius: 6px;
    cursor: zoom-in;
  }
  .gk-figure-caption {
    font-size: 11px; color: #8a9ab8; font-style: italic; line-height: 1.35;
  }

  .gk-previews { margin-top: 14px; display: grid; gap: 10px; }
  .gk-preview-card {
    display: flex; align-items: stretch; gap: 12px;
    padding: 10px; border: 1px solid #dde8f5; border-radius: 8px;
    background: #f7f9fc; text-decoration: none; color: #3a4a6b;
    transition: border-color 120ms, background 120ms;
  }
  .gk-preview-card:hover { border-color: #abc5ec; background: #fff; }
  .gk-preview-card-image {
    flex: 0 0 auto; width: 80px; height: 80px;
    object-fit: cover; border-radius: 6px;
    border: 1px solid #dde8f5; background: #fff;
  }
  .gk-preview-card-favicon-wrap {
    flex: 0 0 auto; width: 80px; height: 80px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px; border: 1px solid #dde8f5; background: #fff;
  }
  .gk-preview-card-favicon {
    width: 48px; height: 48px; object-fit: contain;
  }
  .gk-preview-card-body {
    min-width: 0; display: flex; flex-direction: column; justify-content: center;
  }
  .gk-preview-card-site {
    font-size: 10px; font-weight: 700; letter-spacing: 1.2px;
    text-transform: uppercase; color: #7a8fb5;
    margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .gk-preview-card-title {
    font-size: 13px; font-weight: 600; color: #5876a9; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .gk-preview-card-desc {
    font-size: 12px; color: #7a8fb5; line-height: 1.4; margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  /* YouTube lecture cards: play overlay + timestamp badge on the thumbnail. */
  .gk-preview-card-thumb {
    position: relative; flex: 0 0 auto; width: 80px; height: 80px;
  }
  .gk-preview-card-play {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(200, 40, 40, 0.92); pointer-events: none;
  }
  .gk-preview-card-play::after {
    content: ""; position: absolute; top: 50%; left: 50%;
    transform: translate(-40%, -50%);
    border-style: solid; border-width: 6px 0 6px 10px;
    border-color: transparent transparent transparent #fff;
  }
  .gk-preview-card-ts {
    position: absolute; right: 3px; bottom: 3px;
    background: rgba(0, 0, 0, 0.8); color: #fff;
    font-size: 10px; font-weight: 700; line-height: 1;
    padding: 2px 4px; border-radius: 3px;
  }

  .gk-input-area {
    flex-shrink: 0; padding: 12px 16px;
    border-top: 1px solid #eef2f9;
  }
  .gk-input-row {
    display: flex; gap: 10px; align-items: flex-end;
    border: 1.5px solid #dde8f5; border-radius: 28px;
    background: #fff; overflow: hidden;
    box-shadow: 0 2px 20px rgba(88,118,169,0.08);
  }
  .gk-input-row textarea {
    flex: 1; resize: none; border: none; background: transparent;
    padding: 12px 18px; font-size: 14px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: #3a4a6b; outline: none; line-height: 1.5;
    max-height: 120px;
  }
  .gk-input-row textarea::placeholder { color: #b0bfd4; }
  .gk-input-row .gk-send {
    background: transparent; color: #b0bfd4;
    border: none; padding: 0 20px; font-size: 13px;
    font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    cursor: default; transition: color 0.2s;
    white-space: nowrap; border-radius: 0 26px 26px 0;
    height: 46px;
  }
  .gk-input-row .gk-send:not(:disabled) {
    color: #5876a9; cursor: pointer;
  }
  .gk-input-row .gk-send:not(:disabled):hover { color: #3a5a8c; }
  .gk-input-row .gk-send.stop { color: #c45a55; cursor: pointer; }
  .gk-input-row .gk-send.stop:hover { color: #a23a35; }

  /* Attach button. The row has overflow:hidden, so this needs its own left cap
     radius, mirroring how .gk-send caps the right. */
  .gk-input-row .gk-attach {
    background: transparent; border: none; padding: 0 4px 0 14px;
    color: #b0bfd4; cursor: pointer; height: 46px;
    display: flex; align-items: center;
    border-radius: 26px 0 0 26px; transition: color 0.2s;
    flex-shrink: 0;
  }
  .gk-input-row .gk-attach:hover { color: #5876a9; }
  .gk-input-row .gk-attach:disabled { cursor: default; opacity: 0.45; }
  .gk-input-row .gk-attach svg { width: 18px; height: 18px; display: block; }

  /* Chips live in .gk-input-area, ABOVE the pill — deliberately outside
     renderMessages(), which destroys and rebuilds its subtree every animation
     frame while streaming and would wipe upload state mid-flight. */
  .gk-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .gk-chips:empty { display: none; }

  /* Upload rejections (too large / too many pages / unsupported type). The red
     chip alone is easy to miss and its text is clipped to the chip width, so the
     reason is repeated here in full and stays until dismissed. */
  .gk-upload-err {
    display: none; align-items: flex-start; gap: 8px;
    background: #fdf5f5; border: 1px solid #e6c3c1; border-radius: 10px;
    padding: 8px 10px; margin-bottom: 8px;
    font-size: 12px; line-height: 1.45; color: #8c3b36;
  }
  .gk-upload-err.show { display: flex; }
  /* Non-fatal note (e.g. a scanned PDF) — same slot, amber not red, because the
     file was accepted and nothing needs fixing. */
  .gk-upload-err.warn { background: #fdfaf2; border-color: #e8dcc0; color: #7a5c1e; }
  .gk-upload-err.warn .gk-upload-err-x { color: #c2a86a; }
  .gk-upload-err.warn .gk-upload-err-x:hover { color: #7a5c1e; }
  .gk-upload-err-text { flex: 1; }
  .gk-upload-err-x {
    background: none; border: none; cursor: pointer; color: #c08a86;
    font-size: 15px; line-height: 1; padding: 0 2px; flex-shrink: 0;
  }
  .gk-upload-err-x:hover { color: #8c3b36; }
  .gk-chip {
    display: flex; align-items: center; gap: 8px;
    background: #f4f7fc; border: 1px solid #dde8f5; border-radius: 10px;
    padding: 6px 8px 6px 10px; font-size: 12px; color: #3a4a6b;
    max-width: 260px; position: relative; overflow: hidden;
  }
  .gk-chip.error { border-color: #e6c3c1; background: #fdf5f5; }
  .gk-chip-icon { flex-shrink: 0; color: #7a8fb5; font-size: 13px; }
  .gk-chip-name {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600;
  }
  .gk-chip-meta { color: #7a8fb5; white-space: nowrap; font-size: 11px; }
  .gk-chip-x {
    background: none; border: none; cursor: pointer; color: #b0bfd4;
    font-size: 15px; line-height: 1; padding: 0 2px;
  }
  .gk-chip-x:hover { color: #c45a55; }
  .gk-chip-bar {
    position: absolute; left: 0; bottom: 0; height: 2px;
    background: #5876a9; transition: width 0.2s;
  }
  /* Chips echoed back inside a sent user bubble — no remove button, muted. */
  .gk-bubble .gk-chips { margin: 0 0 6px; }
  .gk-bubble .gk-chip {
    background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.3);
    color: inherit; max-width: 100%;
  }
  .gk-bubble .gk-chip-icon, .gk-bubble .gk-chip-meta { color: inherit; opacity: 0.75; }

  /* Drag-and-drop target is the whole chat surface. */
  .gk-chat.gk-dragging { outline: 2px dashed #5876a9; outline-offset: -6px; }

  .gk-footer {
    flex-shrink: 0; padding: 6px 16px 12px;
    text-align: center;
    font-size: 11px; color: #7a8fb5;
  }
  .gk-footer-link {
    background: transparent; border: none; cursor: pointer;
    font-size: 11px; color: #7a8fb5; text-decoration: underline;
    font-family: inherit; padding: 0;
  }
  .gk-footer-link:hover { color: #5876a9; }

  .gk-modal-overlay {
    position: fixed; inset: 0;
    background: rgba(58,74,107,0.35);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; z-index: 10000;
  }
  .gk-modal-overlay[hidden] { display: none; }
  .gk-modal {
    background: #fff; border-radius: 12px; padding: 16px;
    width: 100%; max-width: 440px;
    box-shadow: 0 8px 24px rgba(58,74,107,0.2);
    display: flex; flex-direction: column; gap: 10px;
  }
  .gk-modal h3 { margin: 0; font-size: 14px; color: #3a4a6b; font-weight: 700; }
  .gk-modal p { margin: 0; font-size: 12px; color: #8a9ab8; }
  .gk-modal textarea {
    border: 1px solid #dde8f5; border-radius: 8px; padding: 8px;
    resize: vertical; min-height: 80px; max-height: 180px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px; color: #3a4a6b; outline: none;
  }
  .gk-modal .gk-modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .gk-modal button {
    font-size: 13px; padding: 6px 12px; border-radius: 8px;
    border: 1px solid #dde8f5; background: #fff; color: #5876a9;
    cursor: pointer; font-family: inherit;
  }
  .gk-modal button.primary {
    background: linear-gradient(135deg, #5876a9, #abc5ec);
    border-color: transparent; color: #fff;
  }

  /* Touch Safari (iPad) auto-zooms the page when focusing an input below
     16px, leaving the chat UI zoomed off-screen. Desktop keeps 14px. */
  @media (pointer: coarse) {
    .gk-input-row textarea { font-size: 16px; }
  }

  @media (max-width: 600px) {
    .gk-chat, .gk-modal-overlay { display: none !important; }
    .page-body.my-10 { padding: 0 !important; }
    #site-header.header { position: relative; z-index: 9999; }
  }

  @media (min-width: 601px) {
    .gk-chat { max-width: 820px; }
    .gk-chat-header { padding: 32px 16px 0; }
  }
</style>

<div class="gk-chat">
  <div class="gk-chat-header">
    <h1>Gary King's AI Avatar</h1>
    <div class="sep">
      <div class="sep-line"></div>
      <div class="sep-dot"></div>
      <div class="sep-line"></div>
    </div>
  </div>

  <div class="gk-chat-messages" id="gk-messages"></div>

  <div class="gk-input-area">
    <div class="gk-chips" id="gk-chips"></div>
    <div class="gk-upload-err" id="gk-upload-err" role="alert" aria-live="polite">
      <span class="gk-upload-err-text" id="gk-upload-err-text"></span>
      <button class="gk-upload-err-x" type="button" id="gk-upload-err-x" aria-label="Dismiss">&times;</button>
    </div>
    <div class="gk-input-row">
      <button id="gk-attach" class="gk-attach" type="button" title="Attach a file" aria-label="Attach a file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <input id="gk-file" type="file" multiple hidden
             accept=".pdf,.csv,.xlsx,.txt,.md,.png,.jpg,.jpeg,.webp,.gif">
      <textarea id="gk-input" rows="1" placeholder="This is Gary King's AI chatbot. How can I help?"></textarea>
      <button id="gk-send" class="gk-send" type="button" disabled>Send &rarr;</button>
    </div>
  </div>

  <div class="gk-footer">
    Designed to improve automatically;
    <button type="button" class="gk-footer-link" id="gk-general-fb">suggestions welcome</button>.
    AI&nbsp;agent? <a class="gk-footer-link" href="/llms.txt">Use the API</a>.
  </div>
</div>

<div class="gk-modal-overlay" id="gk-modal-overlay" hidden>
  <div class="gk-modal" role="dialog" aria-label="Send feedback">
    <h3>Share feedback</h3>
    <p>Tell us what worked, what didn't, or anything you'd like to see improved.</p>
    <textarea id="gk-modal-textarea" placeholder="Your feedback..."></textarea>
    <div class="gk-modal-actions">
      <button type="button" id="gk-modal-cancel">Cancel</button>
      <button type="button" id="gk-modal-send" class="primary">Send</button>
    </div>
  </div>
</div>

<script src="/js/gk-track.js"></script>
<script>
(function() {
  var API_URL = "https://d325iygsd5krw9.cloudfront.net/api/chat";
  var FEEDBACK_URL = "https://4jk1rwjz4a.execute-api.us-east-2.amazonaws.com/feedback";
  var PIXEL_URL = "https://ueczzuogsj2hnfdr7gwfwuh5sa0oozkm.lambda-url.us-east-2.on.aws/";

  /* Analytics. gk-track.js writes nothing to the device (see its header): the
     visitor id is derived server-side from a rotating salt, so there is no
     consent gate here. If the script fails to load, T degrades to a no-op and
     the raw page-view pixel still fires, so the baseline visit count survives. */
  var TRACKED = !!window.GKTrack;
  var T = TRACKED
    ? window.GKTrack.init({ endpoint: PIXEL_URL, surface: "fullpage" })
    : { track: function() {}, trackOnce: function() {}, setConversationId: function() {},
        noteMessageSent: function() {}, noteAnswerReceived: function() {},
        bindComposer: function() {}, bindAnswerLinks: function() {},
        trackAnswerDwell: function() {}, flush: function() {},
        clientContext: function() { return undefined; } };

  if (TRACKED) {
    T.track("page_view", {});
  } else {
    try {
      var pu = encodeURIComponent(location.host + location.pathname);
      var pr = encodeURIComponent(document.referrer || "");
      var puid = (new URLSearchParams(location.search).get("uid") || "").slice(0, 100);
      new Image().src = PIXEL_URL + "?t=gary&u=" + pu + "&r=" + pr + (puid ? "&uid=" + encodeURIComponent(puid) : "") + "&_=" + Date.now();
    } catch (e) {}
  }
  var BOT_ID = "gking";
  var AVATAR_LABEL = "GK";
  var chatEl = document.querySelector(".gk-chat");

  var messagesEl = document.getElementById("gk-messages");
  var textarea = document.getElementById("gk-input");
  var sendBtn = document.getElementById("gk-send");
  var modalOverlay = document.getElementById("gk-modal-overlay");
  var modalTextarea = document.getElementById("gk-modal-textarea");
  var modalSendBtn = document.getElementById("gk-modal-send");
  var modalCancelBtn = document.getElementById("gk-modal-cancel");
  var generalFbBtn = document.getElementById("gk-general-fb");

  var messages = [];
  var loading = false;
  var streaming = false;
  var abortController = null;
  var conversationId = null;
  var streamTarget = "";
  var streamRevealed = 0;
  var streamRevealActive = false;
  var streamMsgIdx = -1;
  var feedbackState = {};
  /* Perceived latency: time-to-first-token is what a user actually waits for,

  var turnStartedAt = null;
  var firstTokenAt = null;

     the 2nd completed assistant reply, once per conversation. */
  var sessionRating = { shown: false, dismissed: false, rated: null, commentOpen: false, commentDraft: "", commentSent: false };

  function uuid() {
    if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c) {
      var r = (Math.random() * 16) | 0;
      return (c === "x" ? r : (r & 0x3) | 0x8).toString(16);

  /* The conversation id lives in sessionStorage, not just in memory, so a
     reload continues the same conversation instead of silently starting a new
     one — which used to inflate the session count and deflate session depth.
     This is the one thing we do put in device storage, and it is the
     "strictly necessary" kind: it exists to keep the chat the user asked for
     working, not to measure them. It dies with the tab. */
  var CONV_KEY = "gk_conv";

  function ensureConversationId() {
    if (!conversationId) {
      try { conversationId = sessionStorage.getItem(CONV_KEY) || null; } catch (e) {}
      if (!conversationId) conversationId = uuid();
      try { sessionStorage.setItem(CONV_KEY, conversationId); } catch (e) {}
    }
    T.setConversationId(conversationId);
    return conversationId;
  }

  /* Click-through: one delegated listener catches every link in the messages
     area (inline citations, preview cards, figures) and records its rank
     within the answer. Links open in _blank so the page survives to deliver
     the beacon. */
  T.bindAnswerLinks(messagesEl);

  /* Copying an answer is a strong value signal and needs no new UI — the
     browser's own copy event tells us. Length only; never the text. */
  messagesEl.addEventListener("copy", function() {
    try {
      var sel = String(document.getSelection ? document.getSelection() : "");
      T.track("copy_answer", { chars: sel.length });
    } catch (e) {}
  });

  function esc(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function renderInline(text) {
    var html = esc(text);
    html = html.replace(/^(#{1,6})\s+(.+)$/gm, function(_, h, c) { return "<strong>" + c + "</strong>"; });
    html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(_, t, u) {
      var safe = /^(https?:|mailto:|\/)/i.test(u) ? u : "#";
      return '<a href="' + esc(safe) + '" target="_blank" rel="noopener noreferrer">' + t + '</a>';
    });
    return html;
  }

  function renderFigures(figs) {
    if (!figs || !figs.length) return "";
    var items = figs.map(function(f) {
      if (!f || !f.url) return "";
      var cap = [];
      if (f.caption) cap.push(esc(f.caption));
      if (f.source_title) cap.push("&mdash; " + esc(f.source_title));
      return '<div class="gk-figure"><a href="' + esc(f.url) + '" target="_blank" rel="noopener"><img src="' + esc(f.url) + '" alt="' + esc(f.caption || "") + '" loading="lazy"></a>' +
        (cap.length ? '<div class="gk-figure-caption">' + cap.join(" ") + '</div>' : '') + '</div>';
    }).join("");
    return '<div class="gk-figures"><div class="gk-figures-label">Referenced figure' + (figs.length > 1 ? "s" : "") + '</div>' + items + '</div>';
  }

  function stripAttach(s) {
    return String(s).replace(/\[ATTACH:[^\]]*\]/g, "").replace(/\n{3,}/g, "\n\n").trim();
  }

  function hostOf(u) {
    try { return new URL(u).hostname; }
    catch(e) { return u; }
  }

  function renderPreviews(previews) {
    if (!previews || !previews.length) return "";
    var items = previews.map(function(p) {
      var host = hostOf(p.url).replace(/^www\./, "");
      var siteName = p.site_name || host;
      var imgHtml;
      if (p.image) {
        imgHtml = '<img class="gk-preview-card-image" src="' + esc(p.image) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">';
      } else {
        var favicon = "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(host) + "&sz=128";
        imgHtml = '<div class="gk-preview-card-favicon-wrap">' +
          '<img class="gk-preview-card-favicon" src="' + esc(favicon) + '" alt="" loading="lazy" onerror="this.parentElement.style.display=\'none\'">' +
        '</div>';
      }
      // YouTube lecture cards carry a timestamp — wrap the thumbnail with a
      // play overlay and a "m:ss" badge so it reads as "jump to this moment".
      if (p.timestamp) {
        imgHtml = '<div class="gk-preview-card-thumb">' + imgHtml +
          '<div class="gk-preview-card-play"></div>' +
          '<div class="gk-preview-card-ts">' + esc(p.timestamp) + '</div>' +
        '</div>';
      }

        ? '<div class="gk-preview-card-desc">' + esc(p.description) + '</div>'

        imgHtml +
        '<div class="gk-preview-card-body">' +
          '<div class="gk-preview-card-site">' + esc(siteName) + '</div>' +
          '<div class="gk-preview-card-title">' + esc(p.title || p.url) + '</div>' +
          descHtml +

    }).join("");
    return '<div class="gk-previews">' + items + '</div>';
  }

  function snapshotMessages() {
    return messages.map(function(m) { return { role: m.role, content: m.content }; });
  }

  function postFeedback(payload) {
    if (!FEEDBACK_URL) return;
    try {
      fetch(FEEDBACK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
        keepalive: true
      }).catch(function() {});
    } catch(e) {}
  }

  function buildFeedbackPayload(opts) {
    return {
      conversation_id: ensureConversationId(),
      message_id: opts.messageId,
      bot_id: BOT_ID,
      timestamp: new Date().toISOString(),
      feedback_type: opts.feedbackType,
      rating: opts.rating || null,
      comment: opts.comment || null,
      messages_snapshot: snapshotMessages(),
      rated_message_index: opts.ratedIndex == null ? null : opts.ratedIndex,
      page_url: location.href,
      user_agent: navigator.userAgent,
      source: "fullpage"
    };
  }

  function maybeShowSessionRating() {
    if (sessionRating.shown) return;
    var n = 0;
    for (var i = 0; i < messages.length; i++) {
      if (messages[i].role === "assistant" && stripAttach(messages[i].content)) n++;
    }
    if (n < 2) return;
    for (var id in feedbackState) {
      if (feedbackState[id] && feedbackState[id].rated) return;
    }
    sessionRating.shown = true;
    postFeedback(buildFeedbackPayload({ messageId: "session", ratedIndex: null, feedbackType: "session_rating_shown", rating: null }));
    T.track("rating_shown", { kind: "session" });
  }

  function hideSessionRatingSoon() {
    setTimeout(function() {

  function renderSessionRatingCard() {
    var card = document.createElement("div");
    card.className = "gk-session-rating";
    if (sessionRating.rated) {
      if (sessionRating.commentOpen) {
        card.innerHTML =
          '<div class="gk-sr-question">Thanks &mdash; anything we could do better? <span class="gk-sr-optional">(optional)</span></div>' +
          '<textarea data-sr-textarea placeholder="Your suggestion..."></textarea>' +
          '<div class="gk-sr-actions">' +
          '<button type="button" data-action="sr-comment-cancel" data-msg-id="session">No thanks</button>' +
          '<button type="button" class="primary" data-action="sr-comment-send" data-msg-id="session">Send</button></div>';
        card.querySelector("textarea").value = sessionRating.commentDraft || "";
      } else {

      }
    } else {
      card.innerHTML =
        '<button type="button" class="gk-sr-dismiss" data-action="sr-dismiss" data-msg-id="session" aria-label="Dismiss">&#10005;</button>' +
        '<div class="gk-sr-question">How is GaryAI doing so far?</div>' +
        '<div class="gk-sr-options">' +
        '<button type="button" data-action="sr-rate" data-sr-value="good" data-msg-id="session">&#128522; Great</button>' +
        '<button type="button" data-action="sr-rate" data-sr-value="fine" data-msg-id="session">&#128528; OK</button>' +
        '<button type="button" data-action="sr-rate" data-sr-value="bad" data-msg-id="session">&#128542; Not helpful</button>' +
        '</div>';

  }

  function thumbSvg(dir, filled) {
    if (dir === "up") return '<svg width="15" height="15" viewBox="0 0 24 24" fill="' + (filled ? "currentColor" : "none") + '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11v9a1 1 0 0 0 1 1h9.5a2 2 0 0 0 2-1.7l1.4-7A2 2 0 0 0 19 10h-5l1-4a2 2 0 0 0-2-2.5L8 11z"/><path d="M3 11h4v10H3z"/></svg>';
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="' + (filled ? "currentColor" : "none") + '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 13V4a1 1 0 0 0-1-1H6.5a2 2 0 0 0-2 1.7l-1.4 7A2 2 0 0 0 5 14h5l-1 4a2 2 0 0 0 2 2.5L16 13z"/><path d="M21 13h-4V3h4z"/></svg>';
  }

  function renderMessages() {
    messagesEl.querySelectorAll("[data-comment-textarea]").forEach(function(ta) {
      var id = ta.getAttribute("data-comment-textarea");
      if (feedbackState[id]) feedbackState[id].commentDraft = ta.value;
    });
    var srTa = messagesEl.querySelector("[data-sr-textarea]");
    if (srTa) sessionRating.commentDraft = srTa.value;

    messagesEl.innerHTML = "";
    chatEl.classList.toggle("gk-empty", messages.length === 0);

    if (messages.length > 0) {
      messages.forEach(function(m, mi) {
        var node = document.createElement("div");
        node.className = "gk-msg " + (m.role === "user" ? "user" : "bot");
        if (m.role === "user") {
          // Echo the attachment chips inside the sent bubble so the turn stays
          // legible after the composer clears.
          var chips = (m.attachmentChips && m.attachmentChips.length)
            ? '<div class="gk-chips">' + chipsHtml(m.attachmentChips, true) + '</div>' : "";
          node.innerHTML = '<div class="gk-bubble">' + chips + esc(m.content) + '</div>';
        } else {
          var vis = stripAttach(m.content);
          var isLast = mi === messages.length - 1;
          var showExtras = !(streaming && isLast);
          var showFigs = m.figures && m.figures.length && showExtras;
          var showPreviews = m.previews && m.previews.length && showExtras;
          node.innerHTML = '<div class="gk-avatar">' + esc(AVATAR_LABEL) + '</div>' +
            '<div class="gk-bubble">' + renderInline(vis) +
            (showPreviews ? renderPreviews(m.previews) : "") +
            (showFigs ? renderFigures(m.figures) : "") + '</div>';
        }
        messagesEl.appendChild(node);

        var canRate = m.role === "assistant" && !!stripAttach(m.content) && !(streaming && mi === messages.length - 1);
        if (canRate) {
          var st = feedbackState[m.id] || {};
          var rated = st.rated || null;
          var row = document.createElement("div");
          row.className = "gk-feedback-row";
          row.innerHTML =
            '<button class="gk-fb-btn up' + (rated === "up" ? " active" : "") + '"' + (rated ? " disabled" : "") +
            ' data-action="rate-up" data-msg-id="' + esc(m.id) + '" data-msg-idx="' + mi + '" aria-label="Helpful">' + thumbSvg("up", rated === "up") + '</button>' +
            '<button class="gk-fb-btn down' + (rated === "down" ? " active" : "") + '"' + (rated ? " disabled" : "") +
            ' data-action="rate-down" data-msg-id="' + esc(m.id) + '" data-msg-idx="' + mi + '" aria-label="Not helpful">' + thumbSvg("down", rated === "down") + '</button>' +
            (st.commentSent ? '<span class="gk-fb-thanks">Thanks for your feedback.</span>' : '');
          messagesEl.appendChild(row);

          if (st.commentOpen) {
            var box = document.createElement("div");
            box.className = "gk-fb-comment";
            box.innerHTML =
              '<textarea data-comment-textarea="' + esc(m.id) + '" placeholder="What was wrong? (optional)"></textarea>' +
              '<div class="gk-fb-actions">' +
              '<button type="button" data-action="comment-cancel" data-msg-id="' + esc(m.id) + '">No thanks</button>' +
              '<button type="button" class="primary" data-action="comment-send" data-msg-id="' + esc(m.id) + '" data-msg-idx="' + mi + '">Send</button></div>';
            box.querySelector("textarea").value = st.commentDraft || "";
            messagesEl.appendChild(box);
          }
        }
      });
    }

    if (loading && (messages.length === 0 || messages[messages.length - 1].role !== "assistant")) {
      var t = document.createElement("div");
      t.className = "gk-msg bot";
      t.innerHTML = '<div class="gk-avatar">' + esc(AVATAR_LABEL) + '</div><div class="gk-typing"><span></span><span></span><span></span></div>';
      messagesEl.appendChild(t);
    }

    if (sessionRating.shown && !sessionRating.dismissed) {
      messagesEl.appendChild(renderSessionRatingCard());
    }

    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function isBusy() { return loading || streaming; }

  function updateSendState() {
    if (isBusy()) {
      sendBtn.disabled = false;
      sendBtn.innerHTML = "Stop";
      sendBtn.classList.add("stop");
    } else {
      // A ready attachment is enough to send on its own; an in-flight upload
      // blocks sending so a file can't be half-attached to a turn.
      var hasReady = typeof readyAttachments === "function" && readyAttachments().length > 0;
      var busyUploading = typeof anyUploading === "function" && anyUploading();
      sendBtn.disabled = (!textarea.value.trim() && !hasReady) || busyUploading;
      sendBtn.innerHTML = "Send &rarr;";
      sendBtn.classList.remove("stop");
    }
  }

  function handleSendClick() {
    if (isBusy()) {
      // Clicking Stop mid-generation is the clearest "too slow / wrong
      // direction" signal there is — much stronger than a missing rating.
      T.track("answer_stopped", {
        waited_ms: turnStartedAt ? Date.now() - turnStartedAt : null,
        chars_received: streamTarget ? streamTarget.length : 0
      }, { immediate: true });
      if (abortController) {
        try { abortController.abort(); } catch (e) {}
      }
    } else {
      send();
    }
  }

  function setLoading(v) {
    loading = v;
    updateSendState();
    renderMessages();
  }

  function startRevealLoop() {
    if (streamRevealActive) return;
    streamRevealActive = true;
    function tick() {
      if (!streamRevealActive) return;
      if (streamRevealed < streamTarget.length && streamMsgIdx >= 0 && messages[streamMsgIdx]) {
        var remaining = streamTarget.length - streamRevealed;
        var step = Math.max(3, Math.min(8, Math.ceil(remaining * 0.08)));
        streamRevealed = Math.min(streamRevealed + step, streamTarget.length);
        messages[streamMsgIdx].content = streamTarget.slice(0, streamRevealed);
        renderMessages();
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function stopRevealLoop() {
    streamRevealActive = false;
    if (streamMsgIdx >= 0 && messages[streamMsgIdx] && streamTarget) {
      messages[streamMsgIdx].content = streamTarget;
      renderMessages();
    }
    streamTarget = "";
    streamRevealed = 0;
    streamMsgIdx = -1;
  }

  // ── File attachments ───────────────────────────────────────────────────────
  // Bytes go browser -> S3 directly via a presigned PUT; only a small descriptor
  // travels with the chat request. Chips live in the input area, outside
  // renderMessages(), which rebuilds its subtree every frame while streaming.

  var UPLOAD_URL_EP = API_URL.replace(/\/api\/chat$/, "/api/upload-url");
  var UPLOAD_PREP_EP = API_URL.replace(/\/api\/chat$/, "/api/upload-prepare");
  var attachBtn = document.getElementById("gk-attach");
  var fileInput = document.getElementById("gk-file");
  var chipsEl = document.getElementById("gk-chips");
  var errEl = document.getElementById("gk-upload-err");
  var errTextEl = document.getElementById("gk-upload-err-text");
  var pending = [];

  // Mirrors the server limits in src/lib/uploads/storage.ts (gking-avatar-v3).
  // Duplicated because the two live in separate repos. The server re-checks
  // everything, so a stale copy here only costs a slower, less specific
  // rejection — it can never let an over-limit file through.
  var MAX_ATTACHMENTS = 3;
  // text is the server's MAX_TEXT_CHARS (a byte length despite the name), not
  // its looser MAX_BYTES.text — pre-checking the tighter of the two here is what
  // makes the message specific instead of a generic server rejection.
  var MAX_BYTES = { pdf: 10485760, image: 5242880, tabular: 10485760, text: 40000 };
  var EXT_KIND = {
    pdf: "pdf", png: "image", jpg: "image", jpeg: "image", webp: "image",
    gif: "image", csv: "tabular", xlsx: "tabular", txt: "text", md: "text"
  };

  function showUploadError(msg) {
    errTextEl.textContent = msg;
    errEl.classList.remove("warn");
    errEl.classList.add("show");
  }
  // Non-fatal notes returned by /api/upload-prepare in `warnings[]` — until now
  // these were parsed and then dropped, so the user never learned that e.g. a
  // scanned PDF would be read as page images.
  function showUploadNote(msg) {
    errTextEl.textContent = msg;
    errEl.classList.add("warn");
    errEl.classList.add("show");
  }
  function clearUploadError() {
    errEl.classList.remove("show");
    errEl.classList.remove("warn");
    errTextEl.textContent = "";
  }
  document.getElementById("gk-upload-err-x").addEventListener("click", clearUploadError);

  // Pre-flight check, so an obviously-too-big file fails instantly instead of
  // after a full upload. Type is re-checked here because the input's `accept`
  // attribute only filters the OS picker — drag-drop and paste bypass it.
  function localRejection(file) {
    var ext = (file.name.split(".").pop() || "").toLowerCase();
    var kind = EXT_KIND[ext];
    if (!kind) {
      return "“" + file.name + "” isn’t a supported file type. " +
        "You can attach PDF, CSV, XLSX, TXT, MD, PNG, JPG, WEBP or GIF files.";
    }
    if (file.size > MAX_BYTES[kind]) {
      return "“" + file.name + "” is " + fmtBytes(file.size) +
        " — the limit is " + fmtBytes(MAX_BYTES[kind]) + " for this file type.";
    }
    return null;
  }

  function anyUploading() {
    return pending.some(function(p) { return p.status === "uploading" || p.status === "preparing"; });
  }
  function readyAttachments() {
    return pending.filter(function(p) { return p.status === "ready"; })
                  .map(function(p) { return p.prepared; });
  }
  function fmtBytes(n) {
    if (!n && n !== 0) return "";
    if (n < 1024) return n + " B";
    if (n < 1048576) return Math.round(n / 1024) + " KB";
    return (n / 1048576).toFixed(1) + " MB";
  }
  function chipIcon(kind) {
    if (kind === "image") return "&#128443;";
    if (kind === "tabular") return "&#128202;";
    return "&#128196;";
  }
  function chipMeta(p) {
    if (p.status === "uploading") return "uploading " + (p.pct || 0) + "%";
    if (p.status === "preparing") return "reading…";
    if (p.status === "error") return p.error || "failed";
    var d = p.prepared || {};
    if (d.pages) return d.pages + (d.pages === 1 ? " page" : " pages");
    return fmtBytes(p.size);
  }
  // Shared by the composer chips and the echo inside a sent user bubble.
  function chipsHtml(items, readonly) {
    return items.map(function(p) {
      var cls = "gk-chip" + (p.status === "error" ? " error" : "");
      var bar = (p.status === "uploading")
        ? '<div class="gk-chip-bar" style="width:' + (p.pct || 0) + '%"></div>' : "";
      var x = readonly ? ""
        : '<button class="gk-chip-x" type="button" data-chip="' + esc(p.id) + '" aria-label="Remove">&times;</button>';
      return '<div class="' + cls + '">' +
        '<span class="gk-chip-icon">' + chipIcon(p.kind) + '</span>' +
        '<span class="gk-chip-name">' + esc(p.name) + '</span>' +
        '<span class="gk-chip-meta">' + esc(chipMeta(p)) + '</span>' + x + bar + '</div>';
    }).join("");
  }
  function renderChips() {
    chipsEl.innerHTML = chipsHtml(pending, false);
    updateSendState();
  }
  chipsEl.addEventListener("click", function(e) {
    var btn = e.target.closest && e.target.closest(".gk-chip-x");
    if (!btn) return;
    var id = btn.getAttribute("data-chip");
    var p = pending.filter(function(x) { return x.id === id; })[0];
    if (p && p.xhr) { try { p.xhr.abort(); } catch (err) {} }
    pending = pending.filter(function(x) { return x.id !== id; });
    clearUploadError();
    renderChips();
  });

  // XHR rather than fetch: fetch still has no upload-progress event, and a large
  // PDF with no progress bar reads as a hung page. `p` is the pending record —
  // the xhr is stored on it so the chip's remove button can abort mid-flight.
  function putWithProgress(p, url, file, contentType, onPct) {
    return new Promise(function(resolve, reject) {
      var xhr = new XMLHttpRequest();
      p.xhr = xhr;
      xhr.open("PUT", url, true);
      xhr.setRequestHeader("Content-Type", contentType);
      xhr.upload.onprogress = function(ev) {
        if (ev.lengthComputable) onPct(Math.round((ev.loaded / ev.total) * 100));
      };
      xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 300) resolve();
        else reject(new Error("upload failed (" + xhr.status + ")"));
      };
      xhr.onerror = function() { reject(new Error("network error during upload")); };
      xhr.onabort = function() { reject(new Error("aborted")); };
      xhr.send(file);
    });
  }

  async function startUpload(file) {
    var p = {
      id: uuid(), name: file.name, size: file.size,
      kind: "text", status: "uploading", pct: 0
    };
    pending.push(p);
    renderChips();
    try {
      var r = await fetch(UPLOAD_URL_EP, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          conversation_id: ensureConversationId(),
          filename: file.name,
          size: file.size
        })
      });
      if (r.status === 403) {
        // Kill switch is on — stop offering uploads at all rather than letting
        // every subsequent attempt fail the same way.
        attachBtn.hidden = true;
        pending = pending.filter(function(x) { return x.id !== p.id; });
        renderChips();
        return;
      }
      var meta = await r.json();
      if (!r.ok) throw new Error(meta.message || "not supported");
      p.kind = meta.kind;
      renderChips();

      await putWithProgress(p, meta.url, file, meta.media_type, function(pct) {
        p.pct = pct; renderChips();
      });

      p.status = "preparing"; renderChips();
      var pr = await fetch(UPLOAD_PREP_EP, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversation_id: ensureConversationId(), key: meta.key })
      });
      var prep = await pr.json();
      if (!pr.ok) throw new Error(prep.message || "could not read the file");
      p.prepared = {
        key: prep.key, file_id: prep.file_id, filename: prep.filename,
        kind: prep.kind, media_type: prep.media_type,
        pages: prep.pages, chars: prep.chars, indexed: prep.indexed
      };
      p.warnings = prep.warnings || [];
      p.status = "ready";
      // The upload feature shipped with no instrumentation; these two events
      // are the whole picture of whether it works for real users.
      T.track("file_upload", {
        outcome: "ready", kind: p.kind, size: p.size,
        pages: prep.pages || null, warnings: (p.warnings || []).length
      });
      if (p.warnings.length) showUploadNote(p.warnings.join(" "));
    } catch (err) {
      var msg = (err && err.message) ? err.message : "Upload failed.";
      p.status = "error";
      T.track("file_upload", {
        outcome: msg === "aborted" ? "cancelled" : "error",
        kind: p.kind, size: p.size, reason: msg.slice(0, 200)
      });
      // The chip is narrow, so it gets a clipped version; the banner below the
      // chips carries the server's full explanation of which limit was hit.
      p.error = msg.slice(0, 60);
      // "aborted" is the user removing the chip mid-upload, not a failure.
      if (msg !== "aborted") showUploadError("“" + p.name + "” — " + msg);
    }
    renderChips();
  }

  function attachFiles(list) {
    clearUploadError();
    for (var i = 0; i < list.length; i++) {
      // startUpload pushes onto `pending` synchronously, so this stays accurate
      // across the loop even though the uploads themselves are in flight.
      if (pending.length >= MAX_ATTACHMENTS) {
        showUploadError("You can attach up to " + MAX_ATTACHMENTS + " files at a time.");
        break;
      }
      var bad = localRejection(list[i]);
      if (bad) { showUploadError(bad); continue; }
      startUpload(list[i]);
    }
  }

  attachBtn.addEventListener("click", function() { fileInput.click(); });
  fileInput.addEventListener("change", function() {
    if (fileInput.files && fileInput.files.length) attachFiles(fileInput.files);
    fileInput.value = "";
  });
  // Drag-and-drop over the whole chat surface.
  ["dragenter", "dragover"].forEach(function(ev) {
    chatEl.addEventListener(ev, function(e) {
      if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") === -1) return;
      e.preventDefault(); chatEl.classList.add("gk-dragging");
    });
  });
  ["dragleave", "drop"].forEach(function(ev) {
    chatEl.addEventListener(ev, function(e) {
      if (ev === "dragleave" && e.relatedTarget && chatEl.contains(e.relatedTarget)) return;
      chatEl.classList.remove("gk-dragging");
    });
  });
  chatEl.addEventListener("drop", function(e) {
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();
    attachFiles(e.dataTransfer.files);
  });
  // Paste an image straight from the clipboard (screenshots of tables/figures).
  textarea.addEventListener("paste", function(e) {
    if (!e.clipboardData || !e.clipboardData.files || !e.clipboardData.files.length) return;
    attachFiles(e.clipboardData.files);
  });

  async function send() {
    var text = textarea.value.trim();
    var atts = readyAttachments();
    // An attachment alone is a valid turn — "here, look at this".
    if ((!text && !atts.length) || loading || anyUploading()) return;
    if (!text && atts.length) text = "Please take a look at this.";
    textarea.value = "";
    textarea.style.height = "auto";
    ensureConversationId();

    turnStartedAt = Date.now();
    firstTokenAt = null;
    T.noteMessageSent();
    // Length and turn index only — the question text itself already lives in
    // the server-side turn log and does not need a second, unreviewed copy.
    T.track("message_sent", {
      chars: text.length,
      attachments: atts.length,
      turn_index: messages.filter(function(m) { return m.role === "user"; }).length + 1
    });
    var userMsg = { id: uuid(), role: "user", content: text };
    if (atts.length) {
      userMsg.attachments = atts;
      // Keep a display copy: `attachments` is the wire format and is serialized
      // to the backend as-is, so nothing UI-only may be added to it.
      userMsg.attachmentChips = pending.filter(function(p) { return p.status === "ready"; })
        .map(function(p) { return { id: p.id, name: p.name, kind: p.kind, size: p.size, status: "ready", prepared: p.prepared }; });
      pending = [];
      clearUploadError();
      renderChips();
    }
    messages.push(userMsg);
    setLoading(true);

    abortController = new AbortController();
    try {
      var res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          botId: BOT_ID, messages: messages,
          conversation_id: ensureConversationId(), source: "fullpage",
          // Campaign + viewport the server can't see, so the turn log carries
          // the same attribution fields as the beacon events.
          client_context: T.clientContext ? T.clientContext() : undefined
        }),
        signal: abortController.signal
      });

      var ct = res.headers.get("Content-Type") || "";
      if (ct.indexOf("text/event-stream") !== -1 && res.body && res.body.getReader) {
        var reader = res.body.getReader();
        var decoder = new TextDecoder();
        var buffer = "";
        messages.push({ id: uuid(), role: "assistant", content: "" });
        var idx = messages.length - 1;
        streaming = true;
        setLoading(false);

        streamTarget = ""; streamRevealed = 0; streamMsgIdx = idx;
        startRevealLoop();

        while (true) {
          var chunk = await reader.read();
          if (chunk.done) break;
          buffer += decoder.decode(chunk.value, { stream: true });
          var lines = buffer.split("\n");
          buffer = lines.pop() || "";
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i];
            if (line.indexOf("data: ") !== 0) continue;
            try {
              var evt = JSON.parse(line.slice(6));
              if (evt.type === "token" && evt.content) {
                if (firstTokenAt === null) firstTokenAt = Date.now();
                streamTarget += evt.content;
              }
              else if (evt.type === "attached_figures") messages[idx].figures = Array.isArray(evt.figures) ? evt.figures : [];
              else if (evt.type === "previews") messages[idx].previews = Array.isArray(evt.items) ? evt.items : [];
              else if (evt.type === "meta") messages[idx].meta = evt;
            } catch(e) {}
          }
        }

        stopRevealLoop();
        if (!messages[idx].content) messages[idx].content = "Sorry, I couldn't generate a response.";
        streaming = false;
        updateSendState();
        maybeShowSessionRating();
        renderMessages();
        noteAnswerComplete("sse", messages[idx]);
      } else {
        var data;
        try { data = await res.json(); } catch(e) { data = null; }
        var reply = (data && (data.reply || data.message || data.response)) || "Sorry, I couldn't generate a response.";
        var figs = data && Array.isArray(data.figures) ? data.figures : [];
        var previews = data && Array.isArray(data.previews) ? data.previews : [];
        messages.push({ id: uuid(), role: "assistant", content: reply, figures: figs, previews: previews });
        maybeShowSessionRating();
        setLoading(false);
        noteAnswerComplete("json", messages[messages.length - 1]);
      }
    } catch(e) {
      var wasAbort = e && (e.name === "AbortError" || /aborted/i.test(String(e.message || "")));
      stopRevealLoop();
      streaming = false;
      if (wasAbort) {
        var last = messages[messages.length - 1];
        if (last && last.role === "assistant" && !last.content) {
          last.content = "_(stopped)_";
        }
      } else {
        // Client-visible failures were previously invisible in the data —
        // there was no error rate at all. Reason only, never the user's text.
        T.track("error", {
          where: "send",
          name: (e && e.name) || "Error",
          message: String((e && e.message) || e).slice(0, 200),
          waited_ms: turnStartedAt ? Date.now() - turnStartedAt : null
        }, { immediate: true });
        messages.push({ id: uuid(), role: "assistant", content: "Sorry, something went wrong. Please try again." });
      }
      setLoading(false);
    } finally {
      abortController = null;
    }
  }

  /* Fired once per completed answer: records perceived latency (first token)
     alongside total time, then starts measuring how long the answer is
     actually read — the missing denominator for the citation click rate. */
  function noteAnswerComplete(mode, msg) {
    T.noteAnswerReceived();
    T.track("answer_received", {
      mode: mode,
      first_token_ms: (firstTokenAt && turnStartedAt) ? firstTokenAt - turnStartedAt : null,
      total_ms: turnStartedAt ? Date.now() - turnStartedAt : null,
      chars: (msg && msg.content) ? msg.content.length : 0,
      figures: (msg && msg.figures) ? msg.figures.length : 0,
      previews: (msg && msg.previews) ? msg.previews.length : 0
    });
    try {
      var nodes = messagesEl.querySelectorAll(".gk-msg.bot");
      var el = nodes[nodes.length - 1];
      if (el) T.trackAnswerDwell(el, { messageId: msg && msg.id });
    } catch (e) {}
    turnStartedAt = null;
    firstTokenAt = null;
  }

  sendBtn.addEventListener("click", handleSendClick);
  textarea.addEventListener("input", function() {
    updateSendState();
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 120) + "px";
  });
  textarea.addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSendClick(); }
  });
  /* chat_focus / first_keystroke / message_abandoned — the three events that
     separate "never considered asking" from "started typing and gave up". */
  T.bindComposer(textarea);

  messagesEl.addEventListener("click", function(e) {
    var target = e.target;
    while (target && target !== messagesEl && !target.getAttribute("data-action")) target = target.parentNode;
    if (!target || target === messagesEl) return;
    var action = target.getAttribute("data-action");
    var msgId = target.getAttribute("data-msg-id");
    var msgIdx = target.getAttribute("data-msg-idx");
    msgIdx = msgIdx == null ? null : parseInt(msgIdx, 10);
    if (!msgId) return;

    if (action === "sr-rate") {
      if (sessionRating.rated) return;
      var srValue = target.getAttribute("data-sr-value");
      sessionRating.rated = srValue;
      sessionRating.commentOpen = srValue !== "good";
      postFeedback(buildFeedbackPayload({ messageId: "session", ratedIndex: null, feedbackType: "session_rating", rating: srValue }));
      T.track("rating_submitted", { kind: "session", rating: srValue });
      if (!sessionRating.commentOpen) hideSessionRatingSoon();
      renderMessages();
      return;
    } else if (action === "sr-dismiss") {
      sessionRating.dismissed = true;
      postFeedback(buildFeedbackPayload({ messageId: "session", ratedIndex: null, feedbackType: "session_rating_dismissed", rating: null }));
      T.track("rating_submitted", { kind: "session", rating: "dismissed" });
      renderMessages();
      return;
    } else if (action === "sr-comment-cancel") {
      sessionRating.commentOpen = false;
      sessionRating.commentDraft = "";
      hideSessionRatingSoon();
      renderMessages();
      return;
    } else if (action === "sr-comment-send") {
      var srTa = messagesEl.querySelector("[data-sr-textarea]");
      var srComment = srTa ? srTa.value.trim() : "";
      sessionRating.commentOpen = false;
      sessionRating.commentDraft = "";
      sessionRating.commentSent = true;
      if (srComment) postFeedback(buildFeedbackPayload({ messageId: "session", ratedIndex: null, feedbackType: "session_comment", rating: sessionRating.rated, comment: srComment }));
      hideSessionRatingSoon();
      renderMessages();
      return;
    }

    if (action === "rate-up" || action === "rate-down") {
      if (feedbackState[msgId] && feedbackState[msgId].rated) return;
      var rating = action === "rate-up" ? "up" : "down";
      feedbackState[msgId] = { rated: rating, commentOpen: rating === "down", commentDraft: "", commentSent: false };
      postFeedback(buildFeedbackPayload({ messageId: msgId, ratedIndex: msgIdx, feedbackType: "rating", rating: rating }));
      renderMessages();
    } else if (action === "comment-cancel") {
      if (feedbackState[msgId]) { feedbackState[msgId].commentOpen = false; feedbackState[msgId].commentDraft = ""; }
      renderMessages();
    } else if (action === "comment-send") {
      var ta = messagesEl.querySelector('[data-comment-textarea="' + msgId + '"]');
      var comment = ta ? ta.value.trim() : "";
      if (!feedbackState[msgId]) feedbackState[msgId] = {};
      feedbackState[msgId].commentOpen = false;
      feedbackState[msgId].commentDraft = "";
      feedbackState[msgId].commentSent = true;
      if (comment) postFeedback(buildFeedbackPayload({ messageId: msgId, ratedIndex: msgIdx, feedbackType: "comment", rating: feedbackState[msgId].rated || null, comment: comment }));
      renderMessages();
    }
  });

  generalFbBtn.addEventListener("click", function() { modalTextarea.value = ""; modalOverlay.hidden = false; modalTextarea.focus(); });
  modalCancelBtn.addEventListener("click", function() { modalOverlay.hidden = true; });
  modalSendBtn.addEventListener("click", function() {
    var text = modalTextarea.value.trim();
    if (text) postFeedback(buildFeedbackPayload({ messageId: "general", ratedIndex: null, feedbackType: "general", rating: null, comment: text }));
    modalOverlay.hidden = true;
  });
  modalOverlay.addEventListener("click", function(e) { if (e.target === modalOverlay) modalOverlay.hidden = true; });

  renderMessages();
  textarea.focus();

  /* On the /ask-gary page: hide the popup widget button on desktop,
     auto-open it full-screen on mobile (where the native chat is hidden). */
  (function() {
    var isMobile = window.innerWidth <= 600;

    function getWidgetShadow() {
      var host = document.getElementById('gking-chat-widget');
      return host && host.shadowRoot ? host.shadowRoot : null;
    }

    function setupDesktop(shadow) {
      var s = document.createElement('style');
      s.textContent = '.btn { display: none !important; }';
      shadow.appendChild(s);
      return true;
    }

    function setupMobile(shadow) {
      if (!window.GKingChat) return false;
      var s = document.createElement('style');
      s.textContent = [
        '.btn { display: none !important; }',
        '.header .close { display: none !important; }',
        '.panel {',
        '  position: fixed !important;',
        '  top: var(--navbar-height, 64px) !important;',
        '  left: 0 !important; right: 0 !important; bottom: 0 !important;',
        '  width: 100% !important; height: auto !important;',
        '  border-radius: 0 !important; border: none !important;',
        '  box-shadow: none !important;',
        '  z-index: 100 !important;',
        '}'
      ].join('\n');
      shadow.appendChild(s);
      window.GKingChat.open();
      window.GKingChat.close = function() {};
      return true;
    }

    function trySetup() {
      var shadow = getWidgetShadow();
      if (!shadow) return false;
      return isMobile ? setupMobile(shadow) : setupDesktop(shadow);
    }

    if (!trySetup()) {
      var check = setInterval(function() { if (trySetup()) clearInterval(check); }, 150);
      setTimeout(function() { clearInterval(check); }, 5000);
    }
  })();
})();
</script>
