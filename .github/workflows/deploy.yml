name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Cancel older deploys so a queued build from an earlier commit cannot
  # finish after a newer one and roll the live site back (see f98bb43
  # overwriting 045bfde on 2026-05-22).
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.160.1"
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Generate redirect stubs
        run: python3 _automation/scripts/build_redirects.py

      - name: Verify Hugo mounts are current
        run: python3 _automation/scripts/generate_mounts.py --check

      - name: Refresh publication first-commit dates
        run: python3 _automation/scripts/writings/compute_publication_first_commit.py

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/New_York
        run: |
          hugo \
            --gc \
            --minify \
            --buildFuture \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Smoke-test build output
        run: python3 _automation/scripts/smoke_build.py

      - name: Build Pagefind search index
        run: npx pagefind --site public

      - name: Rewrite short URLs to serve target content inline
        run: python3 _automation/scripts/apply_rewrites.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      # Live site: gking.harvard.edu CNAMEs to gking-7bw.pages.dev. GitHub Pages
      # still gets an artifact, but visitors hit Cloudflare. The API token's
      # account must own that project — a3a02fc failed with npx exit 1 when
      # deploying only to gking-7bw (likely "Project not found" for this token).
      # List + deploy every gking* project the token can see, and fail if none
      # succeed so we never silently publish only to a dead project again.
      - name: Publish to Cloudflare Pages (live host)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "== Cloudflare Pages projects visible to this API token =="
          npx --yes wrangler@4 pages project list

          echo "== Deploying built site =="
          deployed=0
          # Prefer the DNS target hostname's project name first, then legacy.
          for project in gking-7bw gking; do
            echo "---- pages deploy --project-name=${project} ----"
            if npx --yes wrangler@4 pages deploy public --project-name="${project}" --branch=main; then
              echo "OK: deployed to ${project}"
              deployed=1
            else
              echo "WARN: deploy to ${project} failed (see error above)"
            fi
          done

          if [[ "${deployed}" -ne 1 ]]; then
            echo "::error::No Cloudflare Pages deploy succeeded. Check that CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN belong to the account that owns gking-7bw.pages.dev (see project list above)."
            exit 1
          fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
