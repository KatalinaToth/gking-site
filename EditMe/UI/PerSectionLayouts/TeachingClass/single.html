{{ define "main" }}

{{ if in .RelPermalink "gov2020" }}
<div class="gk-gov2020 max-w-4xl mx-auto px-6 py-6">
  <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-slate-100 mb-4">{{ .Title }}</h1>

  <div class="prose prose-slate max-w-none">
    {{ .Content }}
  </div>

  <div class="mt-5">
    <a href="{{ "teaching/" | relURL }}" class="text-blue-600 hover:underline">← Back to Teaching</a>
  </div>
</div>
{{ else }}
<div class="max-w-4xl mx-auto px-6 py-12">
  <h1 class="text-4xl font-bold tracking-tight text-slate-900 dark:text-slate-100 mb-8">{{ .Title }}</h1>

  <div class="prose prose-slate lg:prose-lg dark:prose-invert max-w-none">
    {{ .Content }}
  </div>

  <div class="mt-8">
    <a href="{{ "teaching/" | relURL }}" class="text-blue-600 hover:underline">← Back to Teaching</a>
  </div>
</div>
{{ end }}

{{ end }}
